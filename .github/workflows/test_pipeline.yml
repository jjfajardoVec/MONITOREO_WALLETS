name: Test AML Pipeline
on:
  push:
    branches:
      - claude/review-shared-conversation-n0GQN
    paths:
      - 'test_pipeline_deltex.py'
      - '.github/workflows/test_pipeline.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Pipeline Test
        run: python3 test_pipeline_deltex.py

name: Test AML Pipeline
on:
  push:
    branches:
      - claude/review-shared-conversation-n0GQN
    paths:
      - 'test_pipeline_deltex.py'
      - '.github/workflows/test_pipeline.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/review-shared-conversation-n0GQN
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Pipeline Test
        run: python3 test_pipeline_deltex.py 2>&1 | tee pipeline_output.txt
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline_output.txt
          git commit -m "Pipeline test output [automated]" || echo "No changes"
          git push
